<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moon in the 8th House in Vedic Astrology</title>
  <desc id="desc">A luminous moon above dark water with subtle gold Vedic chart geometry, symbolizing hidden emotions, transformation, and intuitive depth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#080716"/>
      <stop offset="54%" stop-color="#03030b"/>
      <stop offset="100%" stop-color="#010106"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#f7dc7a" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="52%" stop-color="#ead274"/>
      <stop offset="100%" stop-color="#b58d35"/>
    </radialGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070712"/>
      <stop offset="100%" stop-color="#020207"/>
    </linearGradient>
    <filter id="blurGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect y="575" width="1600" height="325" fill="url(#water)"/>
  <circle cx="800" cy="365" r="360" fill="url(#halo)"/>

  <g opacity="0.42" stroke="#d4af37" stroke-width="1.6" fill="none">
