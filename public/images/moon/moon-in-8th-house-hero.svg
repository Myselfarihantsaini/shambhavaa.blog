    <circle cx="800" cy="365" r="220"/>
    <circle cx="800" cy="365" r="165"/>
    <path d="M530 365h540M800 95v540M609 174l382 382M991 174 609 556"/>
    <path d="M800 95l84 185 201 24-148 139 39 198-176-98-176 98 39-198-148-139 201-24z" opacity="0.35"/>
  </g>

  <g filter="url(#blurGlow)">
    <circle cx="800" cy="365" r="138" fill="url(#moon)"/>
  </g>
  <g opacity="0.18" fill="#6c5522">
    <circle cx="742" cy="333" r="20"/>
    <circle cx="846" cy="398" r="25"/>
    <circle cx="814" cy="314" r="10"/>
    <circle cx="882" cy="342" r="7"/>
