    <circle cx="1240" cy="790" r="1.5"/>
    <circle cx="548" cy="790" r="1.5"/>
  </g>

  <rect x="1" y="1" width="1598" height="898" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
