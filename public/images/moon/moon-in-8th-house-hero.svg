<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moon in the 8th House in Vedic Astrology</title>
  <desc id="desc">A full moon over dark water with gold Vedic chart lines, symbolizing hidden emotions, transformation, and occult insight.</desc>
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="38%" r="30%">
      <stop offset="0%" stop-color="#fff6ce"/>
      <stop offset="38%" stop-color="#d8b95f"/>
      <stop offset="72%" stop-color="#6f5a25" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#05050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonSurface" cx="42%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff8da"/>
      <stop offset="58%" stop-color="#e4c66a"/>
      <stop offset="100%" stop-color="#9d7c32"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070615"/>
      <stop offset="55%" stop-color="#03030a"/>
      <stop offset="100%" stop-color="#010106"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#070712"/>
      <stop offset="100%" stop-color="#020207"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="560" width="1600" height="340" fill="url(#water)"/>

  <circle cx="800" cy="335" r="250" fill="url(#moonGlow)" opacity="0.72"/>
  <circle cx="800" cy="335" r="138" fill="url(#moonSurface)" filter="url(#softGlow)"/>
  <circle cx="758" cy="294" r="18" fill="#b4923c" opacity="0.28"/>
  <circle cx="842" cy="365" r="25" fill="#8f7130" opacity="0.18"/>
  <circle cx="812" cy="274" r="10" fill="#7b6229" opacity="0.2"/>

