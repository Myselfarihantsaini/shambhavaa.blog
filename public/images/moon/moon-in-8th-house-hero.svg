    <ellipse cx="800" cy="700" rx="130" ry="18"/>
    <ellipse cx="800" cy="760" rx="88" ry="12"/>
  </g>

  <g opacity="0.34" stroke="#d4af37" stroke-width="2.2" fill="none">
    <path d="M240 250c78-66 172-96 282-88"/>
    <path d="M1078 162c110-8 204 22 282 88"/>
    <path d="M240 500c76 52 158 70 248 52"/>
    <path d="M1112 552c90 18 172 0 248-52"/>
