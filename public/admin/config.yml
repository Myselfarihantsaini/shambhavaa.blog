# Shambhavaa editor configuration (Sveltia CMS / Decap CMS format).
# Open https://shambhavaa.blog/admin/ and sign in with a GitHub token. Guide: docs/ADMIN-GUIDE.md

backend:
  name: github
  repo: Myselfarihantsaini/shambhavaa.blog
  branch: main
  commit_messages:
    create: 'Publish “{{slug}}” in {{collection}}'
    update: 'Update “{{slug}}” in {{collection}}'
    delete: 'Delete “{{slug}}” from {{collection}}'
    uploadMedia: 'Upload image {{path}}'
    deleteMedia: 'Delete image {{path}}'

# For local editing: run `npm run dev`, open http://localhost:3000/admin/ and choose
# "Work with Local Repository" on the login screen.

site_url: https://shambhavaa.blog
display_url: https://shambhavaa.blog
logo_url: /images/brand/icon-192.png
locale: en

media_folder: public/images/uploads
public_folder: /images/uploads
media_libraries:
  default:
    config:
      max_file_size: 600000   # 600 KB. Export photos as WebP or JPG, 1600 px wide.
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: sun
    label: 'Sun'
    folder: content/sun
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    sortable_fields: [date, title]
    summary: '{{title}}'
    preview_path: '/sun/{{slug}}/'
    fields:
      - label: Title
        name: title
        widget: string
        hint: 'Shown as the headline and in Google. Aim for 50–65 characters. Put the main search phrase first, e.g. “Saturn in 7th House: Marriage, Delay and Commitment”.'
      - label: Publish date
        name: date
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'
        time_format: 'HH:mm'
        picker_utc: true
      - label: Last updated (only for real edits)
        name: updatedDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'
        picker_utc: true
        required: false
        hint: 'Set this only when you change the substance of the article. Do not bump it for typo fixes.'
      - label: Summary
        name: excerpt
        widget: text
        hint: 'One or two sentences, 120–155 characters. Used as the Google description and on article cards.'
        pattern: ['^[\s\S]{40,170}$', 'Write between 40 and 170 characters.']
      - label: Featured on home page
        name: trending
        widget: boolean
        default: false
        required: false
      - label: Cover image
        name: image
        widget: image
        required: false
        hint: 'A real photograph or your own artwork, landscape, at least 1200×675 px. No text written on the image. Avoid AI-looking fantasy art.'
      - label: Cover image description (alt text)
        name: imageAlt
        widget: string
        required: false
        hint: 'Describe what is in the picture for blind readers and Google, e.g. “Saturn photographed by the Cassini spacecraft”.'
      - label: Image credit
        name: imageCredit
        widget: string
        required: false
        hint: 'Photographer or source, e.g. “NASA/JPL-Caltech”. Required for any image you did not make yourself.'
      - label: Search phrases (keywords)
        name: keywords
        widget: list
        required: false
        hint: '3–6 phrases people actually search, e.g. “saturn in 7th house”, “shani in seventh house”. Phrases shared by 2+ articles become topic pages.'
      - label: In short (quick answer)
        name: tldr
        widget: text
        required: false
        hint: '2–3 sentences that directly answer the question in the title. Shown in a box at the top.'
      - label: Key points
        name: keyTakeaways
        widget: list
        required: false
      - label: FAQs
        name: faqs
        widget: list
        required: false
        hint: '3–6 real questions readers ask, each with a 2–4 sentence answer. These can appear in Google results.'
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - label: SEO title (optional)
        name: seoTitle
        widget: string
        required: false
        hint: 'Only if the headline is longer than 65 characters: a shorter version for Google.'
      - label: Hide from Google (noindex)
        name: noindex
        widget: boolean
        default: false
        required: false
      - label: Draft (not published)
        name: draft
        widget: boolean
        default: false
        required: false
      - label: Article
        name: body
        widget: markdown
        hint: 'Start with 2–3 short paragraphs that answer the question. Use “Heading 2” for main sections and “Heading 3” inside them. Link to 2–4 related Shambhavaa articles.'
